# ======================================
# Alice-LG + GoBGP (VPNv4 / VPNv6)
# ======================================
#
# GoBGP gRPC API: 127.0.0.1:50051 (sem TLS)
#
# Install as /etc/alice-lg/alice.conf or start with:
#   alice-lg -config /path/to/alice.gobgp.conf

[server]
# Web interface and API. Use 127.0.0.1:7340 when Alice runs
# behind a reverse proxy (nginx, apache, ...).
listen_http = 0.0.0.0:7340
http_timeout = 120

# Global prefix search
enable_prefix_lookup = true
prefix_lookup_community_filter_cutoff = 100000

enable_neighbors_status_refresh = false

# Local ASN (taken from the route targets 52890:x)
asn = 52890

# memory or postgres
store_backend = memory

routes_store_refresh_parallelism = 1
neighbors_store_refresh_parallelism = 1

# Refresh interval in minutes
routes_store_refresh_interval = 5
neighbors_store_refresh_interval = 5

routes_store_query_limit = 200000

enable_metrics = false

# [postgres]
# url = "postgres://alice:alice@localhost:5432/alice"
# min_connections = 2
# max_connections = 16

[housekeeping]
interval = 5
force_release_memory = true

[pagination]
routes_filtered_page_size = 250
routes_accepted_page_size = 250
routes_not_exported_page_size = 250

[noexport]
# Not exported routes (GoBGP Adj-RIB-Out) are loaded on demand
load_on_demand = true

[rpki]
# No RPKI large communities are used in this network
enabled = false

# Known communities, shown with a description in the web UI.
# Extended communities use the format rt:<asn>:<value>.
[bgp_communities]
# rt:52890:10 = VRF A
# rt:52890:20 = VRF B

[neighbors_columns]
address = Neighbor
asn = ASN
state = State
Uptime = Uptime
Description = Description
routes_received = Routes Received
routes_filtered = Filtered

# The network column also shows the route distinguisher
# of VPNv4/VPNv6 routes.
[routes_columns]
flags =
network = Network
gateway = Next Hop
bgp.local_pref = Local Pref
bgp.med = MED
bgp.as_path = AS Path

[lookup_columns]
flags =
network = Network
gateway = Next Hop
neighbor.asn = ASN
neighbor.description = Description
bgp.as_path = AS Path
routeserver.name = Source

# ======================================
# GoBGP source
# ======================================
[source.gobgp-local]
name = GoBGP
group = MPLS

[source.gobgp-local.gobgp]
# host:port of the GoBGP gRPC API
host = 127.0.0.1:50051
# GoBGP listens without TLS
insecure = true
# Timeout in seconds for each gRPC call
processing_timeout = 300
